<VirtualHost *:8080>
 DocumentRoot /var/www/html
 ErrorLog /proc/self/fd/2
 CustomLog /proc/self/fd/1 combined
 <Directory /var/www/html>
  Require all granted
  AllowOverride None
  Options -Indexes -Includes -ExecCGI
  DirectoryIndex index.php
 </Directory>
 <Directory /var/www/html/drive>
  <FilesMatch "(?i)\.(sql|env|bak|old|orig|tmp|save|ini|md|py|sh|ps1|ya?ml|tar\.gz|zip)$">
   Require all denied
  </FilesMatch>
  <FilesMatch "^(config\.php|auth\.php|check_.*\.php|fix\.php|recover\.php|test.*\.php|setup_admin\.php)$">
   Require all denied
  </FilesMatch>
 </Directory>
 <Directory /var/www/html/drive/skills>
  Require all denied
 </Directory>
 Header always set X-Content-Type-Options "nosniff"
 Header always set X-Frame-Options "SAMEORIGIN"
 Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
